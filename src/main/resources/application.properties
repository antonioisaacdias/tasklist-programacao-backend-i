spring.application.name=tasklist

spring.datasource.url=jdbc:postgresql://localhost:5438/tasklist
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate

# Application logs (services, error handler)
logging.level.com.antoniodias.tasklist=INFO
# One line per HTTP request (method + uri + query string)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
# Uncomment to see the SQL Hibernate runs
#logging.level.org.hibernate.SQL=DEBUG
